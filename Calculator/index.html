<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
            color: white;
        }

        .calculator {
            width: 300px;
            padding: 20px;
            background: #333;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #display {
            width: 100%;
            height: 60px;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 28px;
            text-align: right;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #555;
            color: white;
        }

        button:hover {
            background: #666;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffaa33;
        }

        .clear {
            background: #d9534f;
        }

        .equals {
            background: #28a745;
        }

        .history {
            width: 280px;
            max-height: 450px;
            padding: 20px;
            background: #333;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .history h2 {
            margin-top: 0;
            color: #58a6ff;
        }

        #historyList {
            max-height: 330px;
            overflow-y: auto;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #222;
            border-radius: 8px;
            word-break: break-word;
        }

        .clear-history {
            width: 100%;
            height: 45px;
            margin-top: 15px;
            background: #d9534f;
            font-size: 16px;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
                padding: 20px;
            }

            .history {
                width: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Calculator -->
    <div class="calculator">

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="addToDisplay('%')">%</button>
            <button class="operator" onclick="addToDisplay('/')">÷</button>

            <button onclick="addToDisplay('7')">7</button>
            <button onclick="addToDisplay('8')">8</button>
            <button onclick="addToDisplay('9')">9</button>
            <button class="operator" onclick="addToDisplay('*')">×</button>

            <button onclick="addToDisplay('4')">4</button>
            <button onclick="addToDisplay('5')">5</button>
            <button onclick="addToDisplay('6')">6</button>
            <button class="operator" onclick="addToDisplay('-')">−</button>

            <button onclick="addToDisplay('1')">1</button>
            <button onclick="addToDisplay('2')">2</button>
            <button onclick="addToDisplay('3')">3</button>
            <button class="operator" onclick="addToDisplay('+')">+</button>

            <button onclick="addToDisplay('0')">0</button>
            <button onclick="addToDisplay('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>

    <!-- History -->
    <div class="history">

        <h2>🕘 History</h2>

        <div id="historyList">
            <p>No calculations yet.</p>
        </div>

        <button class="clear-history" onclick="clearHistory()">
            Clear History
        </button>

    </div>

    <script>

        const display = document.getElementById("display");
        const historyList = document.getElementById("historyList");

        function addToDisplay(value) {

            if (display.value === "0") {
                display.value = value;
            } else {
                display.value += value;
            }

        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteNumber() {

            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = "0";
            }

        }

        function calculate() {

            const expression = display.value;

            try {

                const result = Function(
                    "return " + expression
                )();

                if (!Number.isFinite(result)) {
                    display.value = "Error";
                    return;
                }

                display.value = result;

                addToHistory(expression, result);

            } catch {

                display.value = "Error";

            }

        }

        function addToHistory(expression, result) {

            // Remove "No calculations yet."
            if (historyList.children.length === 1 &&
                historyList.children[0].tagName === "P") {

                historyList.innerHTML = "";

            }

            const item = document.createElement("div");

            item.className = "history-item";

            item.textContent =
                expression + " = " + result;

            historyList.prepend(item);

        }

        function clearHistory() {

            historyList.innerHTML =
                "<p>No calculations yet.</p>";

        }

    </script>

</body>
</html>
